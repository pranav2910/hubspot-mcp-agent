[project]
name = "hubspot-mcp"
version = "0.1.0"
description = "HubSpot MCP server with governed tool access"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
  "anthropic>=1,<2",
  "httpx2",
  "pydantic>=2",
  "pyyaml",
  "python-dotenv",
  "anyio",
  "tzdata",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hubspot_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
